<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0e">
  <title>曲祈cookie</title>
  <style>
    :root {
      /* 修改这里即可更换整页背景图片 */
      --background-image: url("./background.jpg");
      --page-overlay: rgba(5, 7, 12, .58);
      --glass: rgba(13, 15, 22, .62);
      --glass-border: rgba(255, 255, 255, .13);
      --text: #f1f1f4;
      --muted: #a2a4ae;
      --accent: #c5b5ff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      color: var(--text);
      background-color: #090a0e;
      background-image:
        linear-gradient(var(--page-overlay), var(--page-overlay)),
        var(--background-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      font-family: Inter, "Segoe UI", "Noto Sans SC", sans-serif;
    }

    .card {
      width: min(100%, 560px);
      padding: clamp(30px, 7vw, 58px);
      border: 1px solid var(--glass-border);
      border-radius: 26px;
      background: var(--glass);
      -webkit-backdrop-filter: blur(28px) saturate(115%);
      backdrop-filter: blur(28px) saturate(115%);
      box-shadow: 0 24px 90px rgba(0, 0, 0, .38);
      animation: enter .8s ease both;
    }

    .eyebrow {
      margin: 0 0 25px;
      color: var(--accent);
      font-size: 11px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(36px, 8vw, 58px);
      font-weight: 550;
      letter-spacing: -.055em;
      line-height: 1.08;
    }

    .rule {
      width: 42px;
      height: 1px;
      margin: 30px 0;
      background: rgba(197, 181, 255, .8);
    }

    .label {
      margin: 0 0 11px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .email-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 15px 16px;
      border: 1px solid rgba(255, 255, 255, .10);
      border-radius: 13px;
      background: rgba(0, 0, 0, .22);
    }

    .email {
      min-width: 0;
      color: var(--text);
      font-size: 14px;
      text-decoration: none;
      overflow-wrap: anywhere;
      transition: color .2s ease;
    }

    .email:hover { color: var(--accent); }

    .copy {
      flex: 0 0 auto;
      padding: 8px 11px;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 9px;
      color: var(--text);
      background: rgba(255, 255, 255, .07);
      font: inherit;
      font-size: 11px;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease;
    }

    .copy:hover {
      background: rgba(197, 181, 255, .14);
      border-color: rgba(197, 181, 255, .35);
    }

    footer {
      margin-top: 35px;
      color: rgba(255, 255, 255, .42);
      font-size: 10px;
      letter-spacing: .16em;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      body { padding: 18px; }
      .card { border-radius: 20px; }
      .email-row { align-items: flex-start; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <p class="eyebrow">Personal page</p>
    <h1>曲祈cookie</h1>

    <div class="rule" aria-hidden="true"></div>

    <p class="label">Email</p>
    <div class="email-row">
      <a class="email" href="mailto:meiyoumeiyou660@gmail.com">
        meiyoumeiyou660@gmail.com
      </a>
      <button class="copy" type="button" id="copyButton">COPY</button>
    </div>

    <footer>© 2026 · PERSONAL SPACE</footer>
  </main>

  <script>
    const button = document.getElementById("copyButton");
    button.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText("meiyoumeiyou660@gmail.com");
        button.textContent = "COPIED";
        window.setTimeout(() => button.textContent = "COPY", 1600);
      } catch {
        button.textContent = "COPY FAILED";
        window.setTimeout(() => button.textContent = "COPY", 1600);
      }
    });
  </script>
</body>
</html>
